spring.application.name=bytedesk-monitor

# ===============================
# Server
# ===============================
server.port=9103

# ===============================
# Spring Boot Admin Server
# https://docs.spring-boot-admin.com/current/server.html
# ===============================
# Admin UI 标题
spring.boot.admin.ui.title=Bytedesk Monitor
# 在 navbar 显示版本号
spring.boot.admin.ui.brand=<img src="assets/img/icon-spring-boot-admin.svg"><span>Bytedesk Monitor</span>
# 监控客户端在线/离线通知
spring.boot.admin.monitor.status-interval=10000ms
spring.boot.admin.monitor.status-lifetime=60000ms
# 客户端请求超时（替代已废弃的 connect-timeout / read-timeout）
spring.boot.admin.monitor.default-timeout=10000ms

# ===============================
# Actuator (monitor 自身健康检查)
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
