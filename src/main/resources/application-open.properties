## 对外开放演示配置

# ===============================
# Server
# ===============================
server.port=9103

# ===============================
# Spring Boot Admin Server
# https://docs.spring-boot-admin.com/current/server.html
# ===============================
spring.boot.admin.ui.title=Bytedesk Monitor
spring.boot.admin.ui.brand=<img src="assets/img/icon-spring-boot-admin.svg"><span>Bytedesk Monitor</span>
spring.boot.admin.monitor.status-interval=10000ms
spring.boot.admin.monitor.status-lifetime=60000ms
spring.boot.admin.monitor.default-timeout=10000ms

# ===============================
# Actuator (monitor 自身健康检查)
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===============================
# Security (Admin UI 登录)
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin

# ===============================
# Mail Notifications
# QQ 邮箱需要先在邮箱设置里开启 SMTP/IMAP，并使用授权码作为密码
# ===============================
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:demo@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com

spring.boot.admin.notify.mail.enabled=true
spring.boot.admin.notify.mail.to=${SPRING_BOOT_ADMIN_NOTIFY_MAIL_TO:demo@example.com}
spring.boot.admin.notify.mail.from=${SPRING_BOOT_ADMIN_NOTIFY_MAIL_FROM:Bytedesk Monitor <demo@example.com>}